name: FocusPilot
options:
  bundleIdPrefix: com.focuspilot
  deploymentTarget:
    macOS: "15.0"
packages:
  FocusPilotKit:
    path: .
targets:
  FocusPilotApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/FocusPilot
    dependencies:
      - package: FocusPilotKit
        product: FocusPilotCore
      - package: FocusPilotKit
        product: FocusPilotPlanner
      - package: FocusPilotKit
        product: FocusPilotVault
      - target: FocusPilotWidget
        embed: true
    info:
      path: Configuration/FocusPilot-Info.plist
      properties:
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "4"
        FocusPilotAppGroupIdentifier: $(FOCUSPILOT_APP_GROUP)
        NSCalendarsFullAccessUsageDescription: FocusPilot reads your calendar to avoid scheduling tasks during existing events and to suggest available focus time.
    entitlements:
      path: Configuration/FocusPilot.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FOCUSPILOT_APP_GROUP)
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuspilot.mac
        PRODUCT_NAME: FocusPilot
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FOCUSPILOT_APP_GROUP: group.com.focuspilot.shared
        REGISTER_APP_GROUPS: YES
        SWIFT_VERSION: 6.0
  FocusPilotWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: FocusPilotWidget
    dependencies:
      - package: FocusPilotKit
        product: FocusPilotCore
    info:
      path: Configuration/FocusPilotWidget-Info.plist
      properties:
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "4"
        FocusPilotAppGroupIdentifier: $(FOCUSPILOT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Configuration/FocusPilotWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(FOCUSPILOT_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuspilot.mac.widget
        PRODUCT_NAME: FocusPilotWidget
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        FOCUSPILOT_APP_GROUP: group.com.focuspilot.shared
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: 6.0
schemes:
  FocusPilot:
    build:
      targets:
        FocusPilotApp: all
        FocusPilotWidget: all
    run:
      config: Debug
    archive:
      config: Release
